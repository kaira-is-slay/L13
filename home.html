<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My School Homepage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form id="loginForm">
    <div class="header">
      <h2 id="welcome">Welcome to My School</h2>
    </div>

    <label for="name">Your Name:</label>
    <input type="text" id="name" required placeholder="Enter name...">

    <label for="subject">Favorite Subject:</label>
    <input type="text" id="subject" required placeholder="Enter subject...">

    <button type="submit" id="savebtn">Save</button>

    <div id="message"></div>
  </form>

  <script src="script.js"></script>
</body>
</html>
